history_mailer_user: ubuntu
history_mailer_dir: "/home/{{ history_mailer_user }}/history_mailer"
history_mailer_venv: "{{ history_mailer_dir }}/venv"
history_mailer_job_script_dir: "{{ history_mailer_dir }}/jobs"
history_mailer_code_dir: "{{ history_mailer_dir }}/code"
history_mailer_log_dir: "{{ history_mailer_dir }}/logs"
history_mailer_email_template_dir: "{{ history_mailer_dir }}/templates"
history_mailer_repo: https://github.com/usegalaxy-au/history-mailer.git
history_mailer_commit_id: main

# History mailer configuration
history_mailer_warn_days: 365
history_mailer_delete_days: 379
history_mailer_email_days_threshold: 14
history_mailer_purge_days_threshold: 6

history_mailer_staging_local_db_file: "{{ history_mailer_dir }}/staging_hm.sqlite"
history_mailer_production_local_db_file: "{{ history_mailer_dir }}/prod_hm.sqlite"

history_mailer_files: []

history_mailer_use_mail_api: false # Must be true for history mailer to work

# Which mail backend history_mailer.py uses: "smtp2go" (default, see
# history_mailer_use_mail_api/mail_base_url/mail_api_key above) or "smtp" (plain
# SMTP via smtplib, uses the four vars below instead). Requires the
# history-mailer MAIL_BACKEND support (see usegalaxy-au/history-mailer PR
# adding it) - a no-op on older checkouts without that change.
history_mailer_mail_backend: smtp2go
history_mailer_smtp_server: ""
history_mailer_smtp_port: 465
history_mailer_smtp_username: ""
history_mailer_smtp_password: ""

history_mailer_enable_cron_jobs: false # When not enabled, cron jobs will be entered in crontab in a disabled state

# CLI flags each cron job passes to history_mailer.py. Overridable for a staged
# rollout (e.g. --dryrun first, then --warn on its own before adding --delete) -
# defaults reproduce the previous hardcoded behavior exactly.
history_mailer_warn_and_delete_flags: "--production --warn --delete --notify"
history_mailer_purge_flags: "--production --purge --notify"

history_mailer_mail_test_user:
  username: "kucing"
  email: "kucing@email.edu.au"
